org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
kotlin.code.style=official
android.useAndroidX=false
# Сборка не отправляет данные наружу (D-12 распространяется и на инструменты).
org.gradle.welcome=never
# Плагин Kotlin не пишет статистику сборки (FUS) в ~/.gradle/kotlin-profile:
# сам он её не отправляет, но файлы с путём проекта и версией ОС забирает
# статистика IDE, если её включили. Проверка — check_build_telemetry.py (D-12).
kotlin.internal.collectFUSMetrics=false
