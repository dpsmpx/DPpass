# Signed Android integration build; release branch publishes explicitly labelled experimental alpha only.
name: DPpass signed Android CI and experimental alpha
on:
  push:
    branches:
      - feature/zapret2-android-dual-mode
      - release/zapret2-v0.7.54-alpha.5
  workflow_dispatch:

permissions:
  contents: write
concurrency:
  # Keep feature checks independent from release signing; cancel only older same-branch runs.
  group: zapret2-signed-preflight-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  signed-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      DPPASS_SIGNING_KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      DPPASS_SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      DPPASS_SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      DPPASS_SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/xray/go.mod
      - name: Use direct Gradle distribution URL (same pinned SHA-256)
        run: sed -i 's@services.gradle.org/distributions@downloads.gradle.org/distributions@' gradle/wrapper/gradle-wrapper.properties
      - name: Install pinned Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" "ndk;30.0.16248370"
      - name: Fetch verified upstream Zapret2 Android assets
        run: python3 tools/zapret2/vendor.py
      - name: Go bridge tests (TCP/UDP desync)
        working-directory: tools/xray
        run: go test ./bridge
      - name: Unit tests
        run: ./gradlew --no-daemon --console=plain :engine:test :connection:test :app:testDebugUnitTest
      - name: Project static checks and Android Lint
        shell: bash
        run: |
          set -euo pipefail
          bash tools/hostcheck/run.sh --quick
          ./gradlew --no-daemon --console=plain :app:lint
      - name: Refuse versionCode downgrade against published alpha
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/release/check_upgrade_code.py
      - name: Build, sign and verify three release APKs
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DPPASS_SIGNING_KEYSTORE_BASE64" || { echo "::error::KEYSTORE_BASE64 secret missing"; exit 1; }
          test -n "$DPPASS_SIGNING_STORE_PASSWORD" || { echo "::error::KEYSTORE_PASSWORD secret missing"; exit 1; }
          test -n "$DPPASS_SIGNING_KEY_ALIAS" || { echo "::error::KEY_ALIAS secret missing"; exit 1; }
          test -n "$DPPASS_SIGNING_KEY_PASSWORD" || { echo "::error::KEY_PASSWORD secret missing"; exit 1; }
          python3 tools/release/sign_apks.py --out build/zapret2-signed-preflight \
            --pinned-fingerprint c18792812566ca4a18b518d51313515ff2d62bf8299446e99943eeb5d0630d11
      - name: Verify bundled upstream Zapret2 assets in all APKs
        run: python3 tools/zapret2/check_apk_assets.py build/zapret2-signed-preflight
      - name: Install signed x86_64 APK on Android emulator (catch package parse failures)
        shell: bash
        timeout-minutes: 15
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          AVDMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name avdmanager -print -quit)"
          "$SDKMANAGER" --install "emulator" "system-images;android-35;google_apis;x86_64"
          accel=off
          if [[ -e /dev/kvm ]]; then
            sudo chmod a+rw /dev/kvm
            accel=on
          fi
          export ANDROID_USER_HOME="$RUNNER_TEMP/android-user"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          printf 'no\n' | "$AVDMANAGER" create avd -n dppass-zapret2-ci -k "system-images;android-35;google_apis;x86_64" --force
          "$ANDROID_HOME/emulator/emulator" -list-avds | tee "$RUNNER_TEMP/avd-list.txt"
          grep -Fx "dppass-zapret2-ci" "$RUNNER_TEMP/avd-list.txt" || { echo "::error::AVD was not registered"; find "$ANDROID_AVD_HOME" -maxdepth 2 -type f -print; exit 1; }
          "$ANDROID_HOME/emulator/emulator" -avd dppass-zapret2-ci \
            -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader_indirect -accel "$accel" \
            > "$RUNNER_TEMP/emulator.log" 2>&1 &
          emulator_pid=$!
          trap 'kill "$emulator_pid" 2>/dev/null || true; tail -n 80 "$RUNNER_TEMP/emulator.log" || true' EXIT
          timeout 240s "$ANDROID_HOME/platform-tools/adb" wait-for-device
          ready=0
          for i in $(seq 1 180); do
            if [[ "$("$ANDROID_HOME/platform-tools/adb" shell getprop sys.boot_completed | tr -d '\r')" == "1" ]]; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" -eq 1 || { echo "::error::Android emulator did not boot"; exit 1; }
          apk="$(find build/zapret2-signed-preflight -maxdepth 1 -name '*-x86_64.apk' -print -quit)"
          test -n "$apk"
          "$ANDROID_HOME/platform-tools/adb" install --no-streaming "$apk"
          "$ANDROID_HOME/platform-tools/adb" shell pm path com.dpsmpx.dppass | grep '^package:'
          "$ANDROID_HOME/platform-tools/adb" uninstall com.dpsmpx.dppass
      - name: Put signed APKs in private draft release (avoids Actions artifact quota)
        if: github.ref_name == 'feature/zapret2-android-dual-mode'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="zapret2-signed-preflight-${GITHUB_SHA:0:12}"
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
            --draft --prerelease --target "$GITHUB_SHA" \
            --title "DPpass signed Android preflight (${GITHUB_SHA:0:12})" \
            --notes "Signed verification build; NOT a finished Zapret2 release. Root and no-root engine acceptance is pending."
          gh release upload "$tag" build/zapret2-signed-preflight/* --repo "$GITHUB_REPOSITORY" --clobber
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json url,isDraft,assets

      - name: Publish pinned-certificate experimental alpha to GitHub Releases
        if: github.ref_name == 'release/zapret2-v0.7.54-alpha.5'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v0.7.54-alpha.5"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release tag already exists; refuse to overwrite artifacts."
            exit 1
          fi
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
            --prerelease --target "$GITHUB_SHA" \
            --title "DPpass v0.7.54-alpha.5 — experimental local Zapret2" \
            --notes "EXPERIMENTAL SIGNED ALPHA: TLS first-byte split, fallback for opaque YouTube CDN TCP/443, corrected QUIC-to-TCP OFF behavior. Not proven to play videos on a mobile network. Root uses upstream Zapret2 nfqws2 v1.0.7 + NFQUEUE; Android VpnService uses DPpass's own local TCP desync and experimental QUIC UDP fake (not all upstream Zapret2 strategies). No external proxy server. Device testing is required; PR #35 remains open. Signed with pinned SHA-256 certificate c18792812566ca4a18b518d51313515ff2d62bf8299446e99943eeb5d0630d11."
          gh release upload "$tag" build/zapret2-signed-preflight/* --repo "$GITHUB_REPOSITORY"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json url,isDraft,isPrerelease,assets
