# Одноразовая сборка PR #34 от 452538a (без секретов и публикации).
# Не сливать в main: проект использует локальный DP Verify (D-23).
name: DPpass PR34 test binaries
on:
  push:
    branches:
      - build/pr34-20261121
    paths:
      - .github/workflows/pr34-oneoff-build.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Android APK, 3 ABI (unsigned)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/xray/go.mod
      - name: Use direct Gradle distribution URL (same SHA-256)
        run: sed -i 's@services.gradle.org/distributions@downloads.gradle.org/distributions@' gradle/wrapper/gradle-wrapper.properties
      - name: Install pinned Android SDK, build-tools, NDK
        run: |
          set -e
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" "ndk;30.0.16248370"
      - name: Build and verify per-ABI APK (unsigned for developer key)
        run: python3 tools/release/sign_apks.py --unsigned
      - name: Deliver Android APK via private draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mv build/release-apk/SHA256SUMS build/release-apk/SHA256SUMS-android.txt
          mv build/release-apk/CERTIFICATE.txt build/release-apk/CERTIFICATE-android.txt
          gh release upload pr34-test-20261121-452538a build/release-apk/* --clobber --repo "$GITHUB_REPOSITORY"

  linux:
    name: Linux archive and PKGBUILD
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/xray/go.mod
      - name: Use direct Gradle distribution URL (same SHA-256)
        run: sed -i 's@services.gradle.org/distributions@downloads.gradle.org/distributions@' gradle/wrapper/gradle-wrapper.properties
      - name: Test desktop and create distribution
        run: ./gradlew --no-daemon --console=plain :desktop:test :desktop:distTar
      - name: Create Linux package and checksums
        shell: bash
        run: |
          set -euo pipefail
          archive="$(find desktop/build/distributions -maxdepth 1 -name 'dppass-desktop-*.tar' -print -quit)"
          test -n "$archive"
          python3 tools/desktop/package.py "$archive" build/linux/dist
      - name: Deliver Linux archive via private draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mv build/linux/dist/SHA256SUMS build/linux/dist/SHA256SUMS-linux.txt
          gh release upload pr34-test-20261121-452538a build/linux/dist/* --clobber --repo "$GITHUB_REPOSITORY"

  windows:
    name: Windows ZIP with setup.exe
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/xray/go.mod
      - name: Install Windows cross-compiler and Wine
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            gcc-mingw-w64-x86-64-posix binutils-mingw-w64-x86-64 wine64
      - name: Use direct Gradle distribution URL (same SHA-256)
        run: sed -i 's@services.gradle.org/distributions@downloads.gradle.org/distributions@' gradle/wrapper/gradle-wrapper.properties
      - name: Build and check Windows distribution
        run: python3 tools/desktop/windows_package.py --require-tests
      - name: Deliver Windows ZIP via private draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mv build/windows/dist/SHA256SUMS build/windows/dist/SHA256SUMS-windows.txt
          gh release upload pr34-test-20261121-452538a build/windows/dist/* --clobber --repo "$GITHUB_REPOSITORY"
