name: DPpass optional Alpine PRoot and terminal CI
on:
  push:
    branches:
      - feature/zapret2-alpine-terminal
      - fix/zapret2-auto-stall-baseline-20261123
      - release/zapret2-v0.7.56-neural-auto
      - feature/neural-variable-parameters-context-persistence
      - release/zapret2-v0.7.57-param-auto
      - fix/neural-learning-diagnostics-20261123
      - release/zapret2-v0.7.58-learning
      - fix/zapret2-api-v4-probe-stages-20261123
      - release/zapret2-v0.7.59-api-diagnostics
      - fix/zapret2-doh-comparison-20261123
      - release/zapret2-v0.7.60-doh-comparison
      - fix/zapret2-ip-tls-h2-quic-matrix-20261123
      - release/zapret2-v0.7.61-ip-tls-quic
      - release/zapret2-v0.7.62-controls-h2
      - release/zapret2-v0.7.63-http3-api
      - release/zapret2-v0.7.64-h3-google-controls
      - release/zapret2-v0.7.65-quic-reply-headers
      - release/zapret2-v0.7.66-quic-v1-v2-compare
      - release/zapret2-v0.7.67-quic-v1-repeatability
      - release/zapret2-v0.7.68-universal-auto-health
      - release/zapret2-v0.7.69-site-strategy-search
      - release/zapret2-v0.7.70-youtube-host-fallback
      - release/zapret2-v0.7.71-http-transport-fix
      - release/zapret2-v0.7.72-youtube-api-ip-h2-sweep
  workflow_dispatch:

concurrency:
  group: alpine-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  alpine-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/xray/go.mod
      - name: Use pinned direct Gradle distribution
        run: sed -i 's@services.gradle.org/distributions@downloads.gradle.org/distributions@' gradle/wrapper/gradle-wrapper.properties
      - name: Install Android SDK, NDK and CMake for PRoot/JNI
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="/usr/local/lib/android/sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" "ndk;30.0.16248370" "cmake;3.22.1"
      - name: Verify pinned Zapret2 assets
        run: python3 tools/zapret2/vendor.py
      - name: Portable Zapret2 strategy and Xray bridge Go tests
        working-directory: tools/xray
        run: go test ./zapret2 ./bridge ./cmd/zapret2-alpine
      - name: Alpine process-layout and activation/adaptive-selection JVM tests
        run: ./gradlew --no-daemon --console=plain :engine:test :connection:test :app:testDebugUnitTest
      - name: Build ARM64 app with actual Alpine minirootfs and PRoot
        run: ./gradlew --no-daemon --console=plain :app:assembleDebug -Pdppass.alpine=true -Pdppass.nativeAbis=arm64-v8a
      - name: Verify PRoot executables, PTY JNI and Alpine rootfs packaged
        shell: bash
        run: |
          python3 - <<'PY'
          import glob, hashlib, zipfile
          files = glob.glob("app/build/outputs/apk/debug/*.apk")
          assert len(files) == 1, files
          with zipfile.ZipFile(files[0]) as z:
              required = [
                  "lib/arm64-v8a/libproot.so",
                  "lib/arm64-v8a/libproot-loader.so",
                  "lib/arm64-v8a/libdpai-native.so",
                  "assets/alpine/rootfs.tgz",
                  "assets/alpine/zapret2-runtime.bin",
                  "assets/alpine/zapret2-runtime.sha256",
                  "assets/alpine/NOTICE.txt",
                  "assets/alpine/GPL-2.0.txt",
              ]
              for path in required:
                  assert path in z.namelist(), path
              # The opt-in strategy MLP is distributed only as a separate
              # No neural model downloads or bundled weights may enter this APK.
              forbidden = [
                  name for name in z.namelist()
                  if "zapret2-mlp-seed-v1.json" in name
                  or name.startswith("models/")
                  or name.startswith("assets/models/")
              ]
              assert not forbidden, ("downloadable neural weights bundled in APK", forbidden)
              data = z.read("assets/alpine/rootfs.tgz")
              assert hashlib.sha256(data).hexdigest() == "4d3f80afaebd447c5591a63a73bde380a149fe8b2d85488cafabb2ff97551f50"
              assert z.read("assets/alpine/zapret2-runtime.bin").startswith(b"\x7fELF")
              exe_digest = hashlib.sha256(z.read("assets/alpine/zapret2-runtime.bin")).hexdigest()
              assert z.read("assets/alpine/zapret2-runtime.sha256").decode().strip() == exe_digest
              for path in required[:3]:
                  assert z.read(path).startswith(b"\x7fELF"), path
          print("Verified optional Alpine ARM64 APK:", files[0])
          PY
      - name: Verify side-by-side experimental APK identity
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit)"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.dpsmpx.dppass.alpine'"
      - name: Refuse Android downgrade against last published signed alpha
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/release/check_upgrade_code.py
      - name: Build optimized ARM64 release variant with Alpine and Xray
        run: ./gradlew --no-daemon --console=plain :app:assembleRelease -Pdppass.alpine=true -Pdppass.nativeAbis=arm64-v8a -Pdppass.abiSplit=true
      - name: Sign official-package ARM64 release with pinned experimental alpha certificate
        shell: bash
        env:
          DPPASS_SIGNING_KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          DPPASS_SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          DPPASS_SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          DPPASS_SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in DPPASS_SIGNING_KEYSTORE_BASE64 DPPASS_SIGNING_STORE_PASSWORD DPPASS_SIGNING_KEY_ALIAS DPPASS_SIGNING_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Release signer is not configured: $name"
              exit 1
            fi
          done
          python3 tools/release/sign_apks.py --skip-build --alpine --abis arm64-v8a \
            --out build/alpine-release-signed \
            --pinned-fingerprint c18792812566ca4a18b518d51313515ff2d62bf8299446e99943eeb5d0630d11
      - name: Verify signed release APK identity, Alpine and absence of neural weights
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, hashlib, zipfile
          apks = glob.glob("build/alpine-release-signed/*.apk")
          assert len(apks) == 1, apks
          with zipfile.ZipFile(apks[0]) as z:
              for path in (
                  "lib/arm64-v8a/libproot.so",
                  "lib/arm64-v8a/libproot-loader.so",
                  "lib/arm64-v8a/libdppassxray.so",
                  "assets/alpine/rootfs.tgz",
                  "assets/alpine/zapret2-runtime.bin",
              ):
                  assert path in z.namelist(), path
              forbidden = [n for n in z.namelist()
                           if n.startswith("models/") or n.startswith("assets/models/")
                           or "zapret2-mlp-seed" in n or n.endswith("server-v1.json")]
              assert not forbidden, forbidden
          print("Verified pinned alpha-certificate ARM64 release APK:", apks[0])
          PY
          apk="$(find build/alpine-release-signed -maxdepth 1 -type f -name '*.apk' -print -quit)"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" | grep -F "package: name='com.dpsmpx.dppass'"
      - uses: actions/upload-artifact@v4
        with:
          name: DPpass-Alpine-Zapret2-ARM64-release-signed
          path: |
            build/alpine-release-signed/*.apk
            build/alpine-release-signed/SHA256SUMS
            build/alpine-release-signed/CERTIFICATE.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 21
      - uses: actions/upload-artifact@v4
        with:
          name: DPpass-Alpine-Zapret2-ARM64-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 21

  publish-release:
    name: Publish tested Alpine APK to Releases
    needs: alpine-android
    if: github.ref == 'refs/heads/feature/zapret2-alpine-terminal' || github.ref == 'refs/heads/release/zapret2-v0.7.56-neural-auto' || github.ref == 'refs/heads/release/zapret2-v0.7.57-param-auto' || github.ref == 'refs/heads/release/zapret2-v0.7.58-learning' || github.ref == 'refs/heads/release/zapret2-v0.7.59-api-diagnostics' || github.ref == 'refs/heads/release/zapret2-v0.7.60-doh-comparison' || github.ref == 'refs/heads/release/zapret2-v0.7.61-ip-tls-quic' || github.ref == 'refs/heads/release/zapret2-v0.7.62-controls-h2' || github.ref == 'refs/heads/release/zapret2-v0.7.63-http3-api' || github.ref == 'refs/heads/release/zapret2-v0.7.64-h3-google-controls' || github.ref == 'refs/heads/release/zapret2-v0.7.65-quic-reply-headers' || github.ref == 'refs/heads/release/zapret2-v0.7.66-quic-v1-v2-compare' || github.ref == 'refs/heads/release/zapret2-v0.7.67-quic-v1-repeatability' || github.ref == 'refs/heads/release/zapret2-v0.7.68-universal-auto-health' || github.ref == 'refs/heads/release/zapret2-v0.7.69-site-strategy-search' || github.ref == 'refs/heads/release/zapret2-v0.7.70-youtube-host-fallback' || github.ref == 'refs/heads/release/zapret2-v0.7.71-http-transport-fix' || github.ref == 'refs/heads/release/zapret2-v0.7.72-youtube-api-ip-h2-sweep'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download APK from the successful build
        uses: actions/download-artifact@v4
        with:
          name: DPpass-Alpine-Zapret2-ARM64-debug
          path: release-input
      - name: Download pinned-certificate release-signed APK from the same successful build
        uses: actions/download-artifact@v4
        with:
          name: DPpass-Alpine-Zapret2-ARM64-release-signed
          path: release-signed-input
      - name: Prepare versioned APK and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          mapfile -d '' -t apks < <(find release-input -type f -name '*.apk' -print0)
          if [[ ${#apks[@]} -ne 1 ]]; then
            echo "::error::Expected exactly one verified ARM64 APK, found ${#apks[@]}"
            exit 1
          fi
          short="${GITHUB_SHA:0:12}"
          cp -- "${apks[0]}" "release-assets/DPpass-Zapret2-Alpine-${short}-arm64-v8a-debug.apk"
          mapfile -d '' -t signed < <(find release-signed-input -type f -name '*.apk' -print0)
          if [[ ${#signed[@]} -ne 1 ]]; then
            echo "::error::Expected one pinned-certificate release APK"
            exit 1
          fi
          cp -- "${signed[0]}" "release-assets/DPpass-Neural-${short}-arm64-v8a-release-signed.apk"
          cp -- release-signed-input/CERTIFICATE.txt release-assets/CERTIFICATE.txt
          (
            cd release-assets
            sha256sum ./*.apk > SHA256SUMS.txt
          )
          cat > release-assets/BUILD_SOURCE.txt <<EOF
          Repository: ${GITHUB_REPOSITORY}
          Branch: ${GITHUB_REF_NAME}
          Commit: ${GITHUB_SHA}
          Actions run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          Android package: com.dpsmpx.dppass.alpine
          Build: experimental Android ARM64 DEBUG + optimized RELEASE signed by pinned alpha key
          Release applicationId: com.dpsmpx.dppass
          Release signer SHA256: c18792812566ca4a18b518d51313515ff2d62bf8299446e99943eeb5d0630d11
          EOF
          cat > "${RUNNER_TEMP}/alpine-release-notes.md" <<EOF
          Experimental **Android ARM64 debug + signed release (pinned alpha certificate)** builds of DPpass Zapret2 Alpine/PRoot.
          Built from \`${GITHUB_SHA}\` and verified by CI.

          - **Signed release APK:** \`DPpass-Neural-*-release-signed.apk\`, package \`com.dpsmpx.dppass\`. Optimized release variant, signed with the **pinned experimental alpha certificate** (not the store production key); can update an installed alpha only if that app has the same signing key and a compatible versionCode.
          - **Debug APK:** \`DPpass-Zapret2-Alpine-*-debug.apk\`, separate package \`com.dpsmpx.dppass.alpine\`; does not replace regular DPpass.
          - Includes Alpine minirootfs, PRoot, JNI bridge and the shared Zapret2 planner.
          - Models are generated locally: use 32/128/512/1024-neuron presets OR enter a manual parameter budget (100,000; 100,000,000; up to 1 billion). The large number is SPARSE ADDRESSABLE CAPACITY, not allocated/trained dense weights. At most 4096 sparse positions are stored, with a compact 1- or 2-layer core.
          - Provider server selection: choose VPN server on the main screen and Automatically in the server list. Existing subscriptions and their keys remain in app-private storage.
          - Signed release has versionCode 150, versionName 0.7.72-dev, package com.dpsmpx.dppass; uses the same pinned experimental alpha signing certificate as DPpass 0.7.62-dev (not the original author or production store key).
          - 0.7.72: explicitly opt-in YouTube API eight-IPv4 HTTP/1.1 vs HTTP/2 ALPN differential, 40 bounded five-second probes plus at most four confirmation repeats. Same pinned Google DoH, protected private Xray outbounds and original TLS SNI; no AUTO training or live-route changes. Observed 0/42 API TLS handshakes on the first two IPv4s; older shorts previews visible, feed not refreshing. This release does NOT claim to fix the API, QUIC or video playback.
          - 0.7.71: repair false 0/6 content reports on 301/404: separate certificate-verified TLS+HTTP transport from validated content, never auto-apply DPI on transport-only evidence. i.ytimg.com now checks fixed public JPEG pixels via existing signed HTTPS endpoint; youtubei.googleapis.com checks the existing unauthenticated /youtubei/v1/browse endpoint. The observed API ClientHello timeout across 42 trials remains unfixed; full YouTube video playback is NOT proven.
          - 0.7.70: one-tap HTTPS scans for YouTube homepage, API and thumbnail CDN; native exact-host verified 3/3 backup only after two independent timeout stalls; QUIC still diagnostic-only and HTTP/3/API/media not claimed.
          - 0.7.69: opt-in any-public-host strategy search via private certificate-verified DoH, two pinned IPv4, 3 independent HTTPS checks per method, TLS-record/TCP and fake/TTL method combinations; exact-host AUTO only on stable 3/3 compared with weak baseline. QUIC method scan is separate and never automatically promotes shared IP routing.
          - 0.7.68: generic passive per-host/per-TCP-or-QUIC AUTO first-reply timeout circuit breaker: two timed-out TLS ClientHello or QUIC Initial observations temporarily skip just that strategy for 90s. Reset by sufficient downstream bytes or network generation; never change DNS, route, server pin, live flows or stored NN weights.
          - 0.7.67: complete the third independent QUIC v1 sample for any first-pass verified YouTube IPv4, even if the second sample fails; require numbered 1/2/3 verified samples before HTTP/3. Run the YouTube QUIC v2 matrix only after a verified Google v2 baseline; otherwise report that it was skipped.
          - 0.7.66: when no v1 YouTube QUIC endpoint achieves 3/3 verified handshakes, independently probe QUIC v2 on the same protected fixed IPv4 set, bracketed by Google QUIC v2 checks. Experimental v2 success does not enable HTTP/3 or train AUTO.
          - 0.7.65 field diagnostic: first UDP reply is classified only by public QUIC v1/v2 header shape (not authentication), with at most two evidence-only retries for failed first attempts. Neither retry confers the 3/3 verified-h3 admission required for HTTP/3.
          - Dedicated YouTube QUIC/HTTP3 experiment now brackets YouTube IPv4 probes with Google QUIC handshakes over the exact same protected Xray UDP adapter. This distinguishes general UDP failures from site- or path-specific failures without treating any handshake as an API/video success.
          - Video playback and YouTube feed scrolling on real mobile networks are **not verified** by CI.
          - Neural training retains independent MOBILE/Wi-Fi/OTHER and TCP/QUIC/TLS/HTTP heads; native snapshots are acknowledged ONLY after successful Android persistence and concurrent updates are not dropped.
          - Diagnostic events: server_auto_learning (post-attempt trained and persisted counts), zapret2_neural_progress (no new trained flow), zapret2_neural_saved (observations and sparse slots).
          - Field evidence: 0/16 youtubei HTTP transport across all eight TCP strategies, but YouTube HTML worked under tlsrec-split/fake-5/AUTO. Google home HTML does NOT prove search results.
          - Extended private TCP/HTTPS autotest (96 requests): fixed Google /search query, same youtubei API host with configured DNS vs IPv4-only test outbound, and timeout phase labels (dial/TLS/HTTP write/headers/body). Test controls do NOT change ordinary VPN routing or claim app/QUIC/HTTP2 verification.
          - Network diagnostic: 85 unreachable IPv6 dials may reflect missing IPv6 route; cause of site failures remains unverified. Includes PR #38 AUTO stall fixes.
          - Includes SHA256SUMS.txt and BUILD_SOURCE.txt for reproducibility.

          Source workflow: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - Optional 16-probe DNS A/B isolates Cloudflare, Google and Quad9 using pinned IPv4 bootstraps to verified DoH endpoints; compares hashed A answer sets and HTTPS with the same youtubei.googleapis.com SNI. No UDP/53 and no regular VPN DNS/routing changes.
          - Tests can distinguish DoH unreachability from target TLS blocking, without making unfounded claims of working feeds, videos or censorship cause.
          Development PR: https://github.com/dpsmpx/DPpass/pull/42
          EOF
      - name: Create or update commit-specific GitHub prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="zapret2-alpine-${GITHUB_SHA:0:12}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            target="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq '.targetCommitish')"
            if [[ "$target" != "$GITHUB_SHA" ]]; then
              echo "::error::Existing release $tag targets a different commit ($target)"
              exit 1
            fi
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --prerelease --latest=false \
              --title "DPpass Neural AUTO ARM64 signed alpha test (${GITHUB_SHA:0:12})" \
              --notes-file "$RUNNER_TEMP/alpine-release-notes.md"
          fi
          gh release upload "$tag" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json url,isDraft,isPrerelease,assets
