name: DPpass optional Alpine PRoot and terminal CI
on:
  push:
    branches:
      - feature/zapret2-alpine-terminal
      - fix/zapret2-auto-stall-baseline-20261123
      - release/zapret2-v0.7.56-neural-auto
      - feature/neural-variable-parameters-context-persistence
      - release/zapret2-v0.7.57-param-auto
      - fix/neural-learning-diagnostics-20261123
      - release/zapret2-v0.7.58-learning
      - fix/zapret2-api-v4-probe-stages-20261123
      - release/zapret2-v0.7.59-api-diagnostics
      - fix/zapret2-doh-comparison-20261123
      - release/zapret2-v0.7.60-doh-comparison
      - fix/zapret2-ip-tls-h2-quic-matrix-20261123
      - release/zapret2-v0.7.61-ip-tls-quic
      - release/zapret2-v0.7.62-controls-h2
      - release/zapret2-v0.7.63-http3-api
      - release/zapret2-v0.7.64-h3-google-controls
      - release/zapret2-v0.7.65-quic-reply-headers
      - release/zapret2-v0.7.66-quic-v1-v2-compare
      - release/zapret2-v0.7.67-quic-v1-repeatability
      - release/zapret2-v0.7.68-universal-auto-health
      - release/zapret2-v0.7.69-site-strategy-search
      - release/zapret2-v0.7.70-youtube-host-fallback
      - release/zapret2-v0.7.71-http-transport-fix
      - release/zapret2-v0.7.72-youtube-api-ip-h2-sweep
      - release/zapret2-v0.7.73-youtube-same-ip-sni-control
      - release/zapret2-v0.7.74-youtube-api-tls-version-control
      - release/dpts-v0.8.0-alpha1
      - release/dpts-v0.8.1-unified
      - release/dpts-v0.8.2
      - feature/dppass-0.8.3
      - release/dppass-v0.8.3-rc1
      - release/dppass-v0.8.3-rc2
      - release/dppass-v0.8.3-rc3
      - release/dppass-v0.8.3-rc4
      - release/dppass-v0.8.3-rc5
      - release/dppass-v0.8.3-rc6
  workflow_dispatch:

concurrency:
  group: alpine-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  alpine-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/xray/go.mod
          cache-dependency-path: tools/xray/go.sum
      - name: Preflight Android upgrade version before expensive builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/release/check_upgrade_code.py
      - name: Check JNI local package allowlist and Gradle inputs
        run: python3 tools/xray/check_cgo_exports.py && python3 tools/xray/check_native_inputs.py && python3 tools/xray/native.py check-packages
      - name: Use pinned direct Gradle distribution
        run: sed -i 's@services.gradle.org/distributions@downloads.gradle.org/distributions@' gradle/wrapper/gradle-wrapper.properties
      - name: Install Android SDK, NDK and CMake for PRoot/JNI
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="/usr/local/lib/android/sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" "ndk;30.0.16248370" "cmake;3.22.1"
      - name: Build pinned original ByeDPI for Android ARM64
        run: python3 tools/byedpi/build_android.py --ndk "$ANDROID_HOME/ndk/30.0.16248370" --abis arm64-v8a
      - name: Cross-link opt-in native DPI library for Android ARM64
        working-directory: tools/xray
        shell: bash
        run: |
          set -euo pipefail
          export CC="$ANDROID_HOME/ndk/30.0.16248370/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang"
          GOOS=android GOARCH=arm64 CGO_ENABLED=1 go test -a -tags localdpi_native -c -o "$RUNNER_TEMP/localdpi-native-android.test" ./localdpi/native
          file "$RUNNER_TEMP/localdpi-native-android.test"
      - name: Verify opt-in native module inside complete Android JNI library
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/xray/native.py android --abi arm64-v8a --out "$RUNNER_TEMP/localdpi-native-jni" --experimental-localdpi-native
          test -s "$RUNNER_TEMP/localdpi-native-jni/arm64-v8a/libdppassxray.so"
      - name: Verify pinned Zapret2 assets
        run: python3 tools/zapret2/vendor.py
      - name: Portable Zapret2 strategy and Xray bridge Go tests
        working-directory: tools/xray
        run: go test ./localdpi ./zapret2 ./bridge ./cmd/zapret2-alpine
      - name: Test Gradle dependency retry policy
        run: bash tools/ci/test-gradle-resolution-retry.sh
      - name: Alpine process-layout and activation/adaptive-selection JVM tests
        shell: bash
        run: bash tools/ci/gradle-resolution-retry.sh :engine:test :connection:test :tunnel:test :app:testDebugUnitTest
      - name: Build ARM64 app with actual Alpine minirootfs and PRoot
        run: ./gradlew --no-daemon --console=plain :app:assembleDebug -Pdppass.alpine=true -Pdppass.nativeAbis=arm64-v8a
      - name: Verify PRoot executables, PTY JNI and Alpine rootfs packaged
        shell: bash
        run: |
          python3 - <<'PY'
          import glob, hashlib, zipfile
          files = glob.glob("app/build/outputs/apk/debug/*.apk")
          assert len(files) == 1, files
          with zipfile.ZipFile(files[0]) as z:
              required = [
                  "lib/arm64-v8a/libproot.so",
                  "lib/arm64-v8a/libproot-loader.so",
                  "lib/arm64-v8a/libdpai-native.so",
                  "assets/alpine/rootfs.tgz",
                  "lib/arm64-v8a/libciadpi.so",
                  "assets/byedpi/LICENSE.txt",
                  "assets/byedpi/SOURCE.txt",
                  "assets/alpine/zapret2-runtime.bin",
                  "assets/alpine/zapret2-runtime.sha256",
                  "assets/alpine/NOTICE.txt",
                  "assets/alpine/GPL-2.0.txt",
              ]
              for path in required:
                  assert path in z.namelist(), path
              # The opt-in strategy MLP is distributed only as a separate
              # No neural model downloads or bundled weights may enter this APK.
              forbidden = [
                  name for name in z.namelist()
                  if "zapret2-mlp-seed-v1.json" in name
                  or name.startswith("models/")
                  or name.startswith("assets/models/")
              ]
              assert not forbidden, ("downloadable neural weights bundled in APK", forbidden)
              data = z.read("assets/alpine/rootfs.tgz")
              assert hashlib.sha256(data).hexdigest() == "4d3f80afaebd447c5591a63a73bde380a149fe8b2d85488cafabb2ff97551f50"
              assert z.read("assets/alpine/zapret2-runtime.bin").startswith(b"\x7fELF")
              exe_digest = hashlib.sha256(z.read("assets/alpine/zapret2-runtime.bin")).hexdigest()
              assert z.read("assets/alpine/zapret2-runtime.sha256").decode().strip() == exe_digest
              for path in required[:3]:
                  assert z.read(path).startswith(b"\x7fELF"), path
          print("Verified optional Alpine ARM64 APK:", files[0])
          PY
      - name: Verify side-by-side experimental APK identity
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit)"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.dpsmpx.dppass.alpine'"
      - name: Refuse Android downgrade against last published signed alpha
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/release/check_upgrade_code.py
      - name: Build optimized ARM64 release variant with Alpine and Xray
        run: ./gradlew --no-daemon --console=plain :app:assembleRelease -Pdppass.alpine=true -Pdppass.nativeAbis=arm64-v8a -Pdppass.abiSplit=true
      - name: Sign official-package ARM64 release with pinned experimental alpha certificate
        shell: bash
        env:
          DPPASS_SIGNING_KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          DPPASS_SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          DPPASS_SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          DPPASS_SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in DPPASS_SIGNING_KEYSTORE_BASE64 DPPASS_SIGNING_STORE_PASSWORD DPPASS_SIGNING_KEY_ALIAS DPPASS_SIGNING_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Release signer is not configured: $name"
              exit 1
            fi
          done
          python3 tools/release/sign_apks.py --skip-build --alpine --abis arm64-v8a \
            --out build/alpine-release-signed \
            --pinned-fingerprint c18792812566ca4a18b518d51313515ff2d62bf8299446e99943eeb5d0630d11
      - name: Verify signed release APK identity, Alpine and absence of neural weights
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, hashlib, zipfile
          apks = glob.glob("build/alpine-release-signed/*.apk")
          assert len(apks) == 1, apks
          with zipfile.ZipFile(apks[0]) as z:
              for path in (
                  "lib/arm64-v8a/libproot.so",
                  "lib/arm64-v8a/libproot-loader.so",
                  "lib/arm64-v8a/libdppassxray.so",
                  "lib/arm64-v8a/libciadpi.so",
                  "assets/byedpi/LICENSE.txt",
                  "assets/byedpi/SOURCE.txt",
                  "assets/alpine/rootfs.tgz",
                  "assets/alpine/zapret2-runtime.bin",
              ):
                  assert path in z.namelist(), path
              byedpi = z.read("lib/arm64-v8a/libciadpi.so")
              assert byedpi.startswith(b"\x7fELF")
              provenance = z.read("assets/byedpi/SOURCE.txt").decode().splitlines()
              assert provenance[0] == "source=https://github.com/hufrea/byedpi/tree/7efde1b1296eaaa187b70e951894dde17527489c"
              assert "arm64-v8a=" + hashlib.sha256(byedpi).hexdigest() in provenance
              forbidden = [n for n in z.namelist()
                           if n.startswith("models/") or n.startswith("assets/models/")
                           or "zapret2-mlp-seed" in n or n.endswith("server-v1.json")]
              assert not forbidden, forbidden
          print("Verified pinned alpha-certificate ARM64 release APK:", apks[0])
          PY
          apk="$(find build/alpine-release-signed -maxdepth 1 -type f -name '*.apk' -print -quit)"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" | grep -F "package: name='com.dpsmpx.dppass'"
      - uses: actions/upload-artifact@v4
        with:
          name: DPpass-Alpine-Zapret2-ARM64-release-signed
          path: |
            build/alpine-release-signed/*.apk
            build/alpine-release-signed/SHA256SUMS
            build/alpine-release-signed/CERTIFICATE.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 21
      - uses: actions/upload-artifact@v4
        with:
          name: DPpass-Alpine-Zapret2-ARM64-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 21

      - name: Build separately installable native local DPI debug APK
        if: github.ref == 'refs/heads/feature/dppass-0.8.3'
        shell: bash
        run: |
          set -euo pipefail
          baseline="$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit)"
          cp "$baseline" "$RUNNER_TEMP/localdpi-baseline.apk"
          bash tools/ci/gradle-resolution-retry.sh :app:assembleDebug -Pdppass.alpine=true -Pdppass.nativeAbis=arm64-v8a -Pdppass.localDpiNativeDebug=true
          apk="$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit)"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" | grep -F "package: name='com.dpsmpx.dppass.alpine.localdpi'"
          mkdir -p "$RUNNER_TEMP/localdpi-debug-apk"
          cp "$apk" "$RUNNER_TEMP/localdpi-debug-apk/DPpass-localdpi-native-arm64-debug.apk"
          python3 tools/localdpi/check_debug_apk.py "$RUNNER_TEMP/localdpi-baseline.apk" "$RUNNER_TEMP/localdpi-debug-apk/DPpass-localdpi-native-arm64-debug.apk"
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/feature/dppass-0.8.3'
        with:
          name: DPpass-LocalDPI-native-ARM64-debug
          path: ${{ runner.temp }}/localdpi-debug-apk/*.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 21

  publish-release:
    name: Publish tested Alpine APK to Releases
    needs: alpine-android
    if: github.ref == 'refs/heads/feature/zapret2-alpine-terminal' || github.ref == 'refs/heads/release/zapret2-v0.7.56-neural-auto' || github.ref == 'refs/heads/release/zapret2-v0.7.57-param-auto' || github.ref == 'refs/heads/release/zapret2-v0.7.58-learning' || github.ref == 'refs/heads/release/zapret2-v0.7.59-api-diagnostics' || github.ref == 'refs/heads/release/zapret2-v0.7.60-doh-comparison' || github.ref == 'refs/heads/release/zapret2-v0.7.61-ip-tls-quic' || github.ref == 'refs/heads/release/zapret2-v0.7.62-controls-h2' || github.ref == 'refs/heads/release/zapret2-v0.7.63-http3-api' || github.ref == 'refs/heads/release/zapret2-v0.7.64-h3-google-controls' || github.ref == 'refs/heads/release/zapret2-v0.7.65-quic-reply-headers' || github.ref == 'refs/heads/release/zapret2-v0.7.66-quic-v1-v2-compare' || github.ref == 'refs/heads/release/zapret2-v0.7.67-quic-v1-repeatability' || github.ref == 'refs/heads/release/zapret2-v0.7.68-universal-auto-health' || github.ref == 'refs/heads/release/zapret2-v0.7.69-site-strategy-search' || github.ref == 'refs/heads/release/zapret2-v0.7.70-youtube-host-fallback' || github.ref == 'refs/heads/release/zapret2-v0.7.71-http-transport-fix' || github.ref == 'refs/heads/release/zapret2-v0.7.72-youtube-api-ip-h2-sweep' || github.ref == 'refs/heads/release/zapret2-v0.7.73-youtube-same-ip-sni-control' || github.ref == 'refs/heads/release/zapret2-v0.7.74-youtube-api-tls-version-control' || github.ref == 'refs/heads/release/dpts-v0.8.0-alpha1' || github.ref == 'refs/heads/release/dpts-v0.8.1-unified' || github.ref == 'refs/heads/release/dpts-v0.8.2' || github.ref == 'refs/heads/release/dppass-v0.8.3-rc1' || github.ref == 'refs/heads/release/dppass-v0.8.3-rc2' || github.ref == 'refs/heads/release/dppass-v0.8.3-rc3' || github.ref == 'refs/heads/release/dppass-v0.8.3-rc4' || github.ref == 'refs/heads/release/dppass-v0.8.3-rc5' || github.ref == 'refs/heads/release/dppass-v0.8.3-rc6'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download APK from the successful build
        uses: actions/download-artifact@v4
        with:
          name: DPpass-Alpine-Zapret2-ARM64-debug
          path: release-input
      - name: Download pinned-certificate release-signed APK from the same successful build
        uses: actions/download-artifact@v4
        with:
          name: DPpass-Alpine-Zapret2-ARM64-release-signed
          path: release-signed-input
      - name: Prepare versioned APK and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          mapfile -d '' -t apks < <(find release-input -type f -name '*.apk' -print0)
          if [[ ${#apks[@]} -ne 1 ]]; then
            echo "::error::Expected exactly one verified ARM64 APK, found ${#apks[@]}"
            exit 1
          fi
          short="${GITHUB_SHA:0:12}"
          if [[ "$GITHUB_REF_NAME" != "release/dpts-v0.8.2" && "$GITHUB_REF_NAME" != "release/dppass-v0.8.3-rc1" && "$GITHUB_REF_NAME" != "release/dppass-v0.8.3-rc2" && "$GITHUB_REF_NAME" != "release/dppass-v0.8.3-rc3" && "$GITHUB_REF_NAME" != "release/dppass-v0.8.3-rc4" && "$GITHUB_REF_NAME" != "release/dppass-v0.8.3-rc5" && "$GITHUB_REF_NAME" != "release/dppass-v0.8.3-rc6" ]]; then
            cp -- "${apks[0]}" "release-assets/DPpass-Zapret2-Alpine-${short}-arm64-v8a-debug.apk"
          fi
          mapfile -d '' -t signed < <(find release-signed-input -type f -name '*.apk' -print0)
          if [[ ${#signed[@]} -ne 1 ]]; then
            echo "::error::Expected one pinned-certificate release APK"
            exit 1
          fi
          cp -- "${signed[0]}" "release-assets/DPpass-Neural-${short}-arm64-v8a-release-signed.apk"
          cp -- release-signed-input/CERTIFICATE.txt release-assets/CERTIFICATE.txt
          (
            cd release-assets
            sha256sum ./*.apk > SHA256SUMS.txt
          )
          cat > release-assets/BUILD_SOURCE.txt <<EOF
          Repository: ${GITHUB_REPOSITORY}
          Branch: ${GITHUB_REF_NAME}
          Commit: ${GITHUB_SHA}
          Actions run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          Debug package (CI only for stable release): com.dpsmpx.dppass.alpine
          Build: Android ARM64 optimized RELEASE signed by established direct-distribution key; separate debug variant for CI
          Release applicationId: com.dpsmpx.dppass
          Release signer SHA256: c18792812566ca4a18b518d51313515ff2d62bf8299446e99943eeb5d0630d11
          EOF
          cat > "${RUNNER_TEMP}/alpine-release-notes.md" <<EOF
          Experimental **Android ARM64 debug + signed release (pinned alpha certificate)** builds of DPpass Zapret2 Alpine/PRoot.
          Built from \`${GITHUB_SHA}\` and verified by CI.

          - **Signed release APK:** \`DPpass-Neural-*-release-signed.apk\`, package \`com.dpsmpx.dppass\`. Optimized release variant, signed with the **pinned experimental alpha certificate** (not the store production key); can update an installed alpha only if that app has the same signing key and a compatible versionCode.
          - **Debug APK:** \`DPpass-Zapret2-Alpine-*-debug.apk\`, separate package \`com.dpsmpx.dppass.alpine\`; does not replace regular DPpass.
          - Includes Alpine minirootfs, PRoot, JNI bridge and the shared Zapret2 planner.
          - Models are generated locally: use 32/128/512/1024-neuron presets OR enter a manual parameter budget (100,000; 100,000,000; up to 1 billion). The large number is SPARSE ADDRESSABLE CAPACITY, not allocated/trained dense weights. At most 4096 sparse positions are stored, with a compact 1- or 2-layer core.
          - Provider server selection: choose VPN server on the main screen and Automatically in the server list. Existing subscriptions and their keys remain in app-private storage.
          - Signed release has versionCode 154, versionName 0.8.1-dev, package com.dpsmpx.dppass; uses the same pinned experimental alpha signing certificate as DPpass 0.7.62-dev (not the original author or production store key).
          - 0.8.1-dev: unified Script Testing screen with no legacy test buttons, 17 editable DPTS presets including original suites, 30 persisted local scripts, load/save/run/stop, and explicit verified-content neural training gated on independent 3/3 results for two public IPs versus plain failure. Native MLP contextual head update is opt-in and cannot automatically pin routing. API 0/32 failures are not positive training samples.
          - 0.8.0-alpha1: first functional DPTS/1 scripting foundation: editable script/presets UI, protected diagnostics with native bounded grammar and certificate validation, H1/H2, TLS1.2/1.3, QUIC transport, finite profile matrices, automatic clipboard report, and no AUTO mutation. learn observe reports candidate evidence but deliberately DOES NOT change neural weights. Broader upstream methods and verified-content training are not implemented in this alpha.
          - 0.7.74: optional certificate-verified TLS 1.2-only and 1.3-only same-IP controls for youtubei.googleapis.com versus www.google.com (2 public IPv4s, 2 versions, 2 original SNI names, 3 sockets each, 24 max). Diagnostics only; AUTO unchanged, and no claim of usable YouTube API or feed.
          - 0.7.73: opt-in certificate-verified same-IP SNI comparison on all eight YouTube API Google-DoH public IPv4s (original API SNI versus www.google.com control), plus separate independent Google-positive control. Only three independent matched Google successes versus API failures support a host-specific hypothesis; no cause or working feed is asserted. Native fix: even diagnostic dial errors never seed AUTO evidence.
          - 0.7.72: explicitly opt-in YouTube API eight-IPv4 HTTP/1.1 vs HTTP/2 ALPN differential, 40 bounded five-second probes plus at most four confirmation repeats. Same pinned Google DoH, protected private Xray outbounds and original TLS SNI; no AUTO training or live-route changes. Observed 0/42 API TLS handshakes on the first two IPv4s; older shorts previews visible, feed not refreshing. This release does NOT claim to fix the API, QUIC or video playback.
          - 0.7.71: repair false 0/6 content reports on 301/404: separate certificate-verified TLS+HTTP transport from validated content, never auto-apply DPI on transport-only evidence. i.ytimg.com now checks fixed public JPEG pixels via existing signed HTTPS endpoint; youtubei.googleapis.com checks the existing unauthenticated /youtubei/v1/browse endpoint. The observed API ClientHello timeout across 42 trials remains unfixed; full YouTube video playback is NOT proven.
          - 0.7.70: one-tap HTTPS scans for YouTube homepage, API and thumbnail CDN; native exact-host verified 3/3 backup only after two independent timeout stalls; QUIC still diagnostic-only and HTTP/3/API/media not claimed.
          - 0.7.69: opt-in any-public-host strategy search via private certificate-verified DoH, two pinned IPv4, 3 independent HTTPS checks per method, TLS-record/TCP and fake/TTL method combinations; exact-host AUTO only on stable 3/3 compared with weak baseline. QUIC method scan is separate and never automatically promotes shared IP routing.
          - 0.7.68: generic passive per-host/per-TCP-or-QUIC AUTO first-reply timeout circuit breaker: two timed-out TLS ClientHello or QUIC Initial observations temporarily skip just that strategy for 90s. Reset by sufficient downstream bytes or network generation; never change DNS, route, server pin, live flows or stored NN weights.
          - 0.7.67: complete the third independent QUIC v1 sample for any first-pass verified YouTube IPv4, even if the second sample fails; require numbered 1/2/3 verified samples before HTTP/3. Run the YouTube QUIC v2 matrix only after a verified Google v2 baseline; otherwise report that it was skipped.
          - 0.7.66: when no v1 YouTube QUIC endpoint achieves 3/3 verified handshakes, independently probe QUIC v2 on the same protected fixed IPv4 set, bracketed by Google QUIC v2 checks. Experimental v2 success does not enable HTTP/3 or train AUTO.
          - 0.7.65 field diagnostic: first UDP reply is classified only by public QUIC v1/v2 header shape (not authentication), with at most two evidence-only retries for failed first attempts. Neither retry confers the 3/3 verified-h3 admission required for HTTP/3.
          - Dedicated YouTube QUIC/HTTP3 experiment now brackets YouTube IPv4 probes with Google QUIC handshakes over the exact same protected Xray UDP adapter. This distinguishes general UDP failures from site- or path-specific failures without treating any handshake as an API/video success.
          - Video playback and YouTube feed scrolling on real mobile networks are **not verified** by CI.
          - Neural training retains independent MOBILE/Wi-Fi/OTHER and TCP/QUIC/TLS/HTTP heads; native snapshots are acknowledged ONLY after successful Android persistence and concurrent updates are not dropped.
          - Diagnostic events: server_auto_learning (post-attempt trained and persisted counts), zapret2_neural_progress (no new trained flow), zapret2_neural_saved (observations and sparse slots).
          - Field evidence: 0/16 youtubei HTTP transport across all eight TCP strategies, but YouTube HTML worked under tlsrec-split/fake-5/AUTO. Google home HTML does NOT prove search results.
          - Extended private TCP/HTTPS autotest (96 requests): fixed Google /search query, same youtubei API host with configured DNS vs IPv4-only test outbound, and timeout phase labels (dial/TLS/HTTP write/headers/body). Test controls do NOT change ordinary VPN routing or claim app/QUIC/HTTP2 verification.
          - Network diagnostic: 85 unreachable IPv6 dials may reflect missing IPv6 route; cause of site failures remains unverified. Includes PR #38 AUTO stall fixes.
          - Includes SHA256SUMS.txt and BUILD_SOURCE.txt for reproducibility.

          Source workflow: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - Optional 16-probe DNS A/B isolates Cloudflare, Google and Quad9 using pinned IPv4 bootstraps to verified DoH endpoints; compares hashed A answer sets and HTTPS with the same youtubei.googleapis.com SNI. No UDP/53 and no regular VPN DNS/routing changes.
          - Tests can distinguish DoH unreachability from target TLS blocking, without making unfounded claims of working feeds, videos or censorship cause.
          Development PR: https://github.com/dpsmpx/DPpass/pull/42
          EOF
      - name: Create or update GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="zapret2-alpine-${GITHUB_SHA:0:12}"
          flags=(--prerelease --latest=false)
          title="DPpass Neural AUTO ARM64 signed alpha test (${GITHUB_SHA:0:12})"
          notes="$RUNNER_TEMP/alpine-release-notes.md"
          if [[ "$GITHUB_REF_NAME" == "release/dpts-v0.8.2" ]]; then
            tag=v0.8.2
            flags=(--latest)
            title="DPpass 0.8.2 — ARM64 release"
            notes="$RUNNER_TEMP/dppass-stable-notes.md"
            printf '%s\n' 'DPpass 0.8.2, versionCode 155. Signed ARM64 APK, applicationId com.dpsmpx.dppass. The previous direct-distribution certificate is unchanged. Training result is appended to the automatically copied DPTS report. Four additional native DPTS profiles are available: split-2, fake-2, fake-4, fake-8. Full upstream Zapret2/ByeDPI integration is not included. No debug APK is included. Real-device network results remain unverified.' > "$notes"
          fi
          if [[ "$GITHUB_REF_NAME" == "release/dppass-v0.8.3-rc1" ]]; then
            tag=v0.8.3-rc.1
            flags=(--prerelease --latest=false)
            title="DPpass 0.8.3 RC1 — ARM64 signed device test"
            notes="$RUNNER_TEMP/dppass-083-notes.md"
            printf '%s\n' 'DPpass 0.8.3, versionCode 157. Signed ARM64 release APK, package com.dpsmpx.dppass, same direct-distribution certificate. Includes original Zapret2 root NFQUEUE, compatible no-root Xray/Alpine adapter, original ByeDPI v0.17.3 with a local SOCKS authentication patch for VpnService, and IPv4 and optional IPv6 transparent root TCP. Full upstream nfqws2 is unavailable without NFQUEUE/root. Root ByeDPI UDP transparent redirection is not implemented; IPv6 TCP requires IPv6 NAT support. Real Android and provider network tests are pending. No debug APK attached.' > "$notes"
          fi
          if [[ "$GITHUB_REF_NAME" == "release/dppass-v0.8.3-rc2" ]]; then
            tag=v0.8.3-rc.2
            flags=(--prerelease --latest=false)
            title="DPpass 0.8.3 RC2 — dashboard and ByeDPI startup"
            notes="$RUNNER_TEMP/dppass-083-rc2-notes.md"
            printf '%s\n' 'DPpass 0.8.3-rc.2, versionCode 158. Signed ARM64 APK, same package and signer. Compact dashboard, local SOCKS startup stages, native authenticated SOCKS smoke test, bounded plain-media retry and monotonic neural snapshot guard. Root requires executable su; full no-root upstream nfqws2 is unavailable. Physical acceptance and YouTube content access remain unverified.' > "$notes"
          fi
          if [[ "$GITHUB_REF_NAME" == "release/dppass-v0.8.3-rc3" ]]; then
            tag=v0.8.3-rc.3
            flags=(--prerelease --latest=false)
            title="DPpass 0.8.3 RC3 — local route and DNS"
            notes="$RUNNER_TEMP/dppass-083-rc3-notes.md"
            printf '%s\n' 'DPpass 0.8.3-rc.3, versionCode 159. Signed ARM64 APK, same package and signer. Explicit TUN DNS route despite LAN bypass; reconnect local engines when DNS settings change; IPv4-only DNS for mobile local sessions, IPv6 still captured; separate backend and terminal-route counters; fixed Google DNS/HTTPS dispatcher control (not Android TUN). No claim of working YouTube or repaired physical path until device tests.' > "$notes"
          fi
          if [[ "$GITHUB_REF_NAME" == "release/dppass-v0.8.3-rc4" ]]; then
            tag=v0.8.3-rc.4
            flags=(--prerelease --latest=false)
            title="DPpass 0.8.3 RC4 — neural persistence diagnostics"
            notes="$RUNNER_TEMP/dppass-083-rc4-notes.md"
            printf '%s\n' 'DPpass 0.8.3-rc.4, versionCode 160. Signed ARM64 release APK, same package and signer. Additional strategy snapshot flush after engine shutdown and restored model counters in the journal. RC3 field test confirms Google Search in both no-root modes; partial YouTube functionality in ByeDPI only. RC4 persistence and network regression tests on a physical device are pending. No claim of repairing remaining service access. No debug APK attached.' > "$notes"
          fi
          if [[ "$GITHUB_REF_NAME" == "release/dppass-v0.8.3-rc5" ]]; then
            tag=v0.8.3-rc.5
            flags=(--prerelease --latest=false)
            title="DPpass 0.8.3 RC5 — session-scoped route diagnostics"
            notes="$RUNNER_TEMP/dppass-083-rc5-notes.md"
            printf '%s\n' 'DPpass 0.8.3-rc.5, versionCode 161. Signed ARM64 release APK, same package and signer. Bind local diagnostics and neural network-change handling to the actual session, not the saved preference. Record post-control route windows at approximately 5, 15 and 30 seconds and final totals for both local backends. Regression tests for counter baselines and inconsistent samples. RC4 device test: 18 model observations restored; Google unstable in Zapret2; ByeDPI YouTube feed/comments/previews work, fresh media not verified. RC5 does not change live routing strategies; physical acceptance remains pending. No debug APK attached.' > "$notes"
          fi
          if [[ "$GITHUB_REF_NAME" == "release/dppass-v0.8.3-rc6" ]]; then
            tag=v0.8.3-rc.6
            flags=(--prerelease --latest=false)
            title="DPpass 0.8.3 RC6 — local startup and learning evidence"
            notes="$RUNNER_TEMP/dppass-083-rc6-notes.md"
            printf '%s\n' 'DPpass 0.8.3-rc.6, versionCode 162. Signed ARM64 release APK, same package and signer. Initialize the physical underlying network in the local VpnService builder, using the same network snapshot for IPv4-only DNS selection. Ordinary zero-byte TCP/UDP close is no longer a negative AUTO training event; explicit read timeouts remain evidence. RC5 device tests confirm fresh YouTube playback and seeking in ByeDPI and monotonic strategy snapshot persistence; Zapret2 startup and playback remain unresolved. RC6 requires physical verification. No debug APK attached.' > "$notes"
          fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            target="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq '.targetCommitish')"
            if [[ "$target" != "$GITHUB_SHA" ]]; then
              echo "::error::Existing release $tag targets a different commit ($target)"
              exit 1
            fi
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" "${flags[@]}" \
              --title "$title" \
              --notes-file "$notes"
          fi
          gh release upload "$tag" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json url,isDraft,isPrerelease,assets
