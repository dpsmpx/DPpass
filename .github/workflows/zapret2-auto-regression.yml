name: Zapret2 AUTO regression tests

on:
  push:
    branches:
      - 'fix/zapret2-*'
      - 'feature/dppass-0.8.3'
      - 'feat/server-favorites-and-scoped-latency'
  pull_request:
    paths:
      - 'tools/xray/bridge/**'
      - 'tools/xray/zapret2/**'
      - 'tools/xray/localdpi/**'
      - 'tools/localdpi/**'
      - 'tools/device/verify_installed_candidate.py'
      - 'tools/device/test_verify_installed_candidate.py'
      - 'tools/device/summarize_server_auto.py'
      - 'tools/device/test_summarize_server_auto.py'
      - 'tools/xray/cmd/zapret2-alpine/**'
      - 'tools/xray/go.mod'
      - 'tools/xray/go.sum'
      - 'tools/xray/native.py'
      - 'tools/xray/jni/**'
      - 'tools/xray/check_native_inputs.py'
      - 'tools/xray/check_cgo_exports.py'
      - 'app/build.gradle.kts'
      - 'desktop/build.gradle.kts'
      - '.github/workflows/zapret2-auto-regression.yml'

permissions:
  contents: read

concurrency:
  group: zapret2-auto-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/xray/go.mod
          cache-dependency-path: tools/xray/go.sum
      - name: Check JNI local package allowlist and Gradle inputs
        run: python3 tools/xray/check_cgo_exports.py && python3 tools/xray/check_native_inputs.py && python3 tools/xray/native.py check-packages
      - name: Test native candidate APK verification and manifest
        run: python3 tools/localdpi/tests/check_debug_apk_test.py
      - name: Test offline local acceptance report verification
        run: python3 tools/localdpi/tests/verify_acceptance_report_test.py
      - name: Test read-only installed APK acceptance
        run: python3 tools/device/test_verify_installed_candidate.py
      - name: Test offline server AUTO outcome summaries
        run: python3 tools/device/test_summarize_server_auto.py
      - name: Compile and test pinned ByeDPI packet module on host
        run: bash tools/localdpi/check_byedpi_packets.sh
      - name: Test ROOT pidfd identity and exit on Linux
        run: |
          set -euo pipefail
          cc -std=c11 -Wall -Wextra -Werror -O2 -Itools/localdpi tools/localdpi/root_pidfd.c tools/localdpi/tests/root_pidfd_test.c -o "$RUNNER_TEMP/root-pidfd-test"
          "$RUNNER_TEMP/root-pidfd-test"
          cc -std=c11 -Wall -Wextra -Werror -O2 -Itools/localdpi tools/localdpi/root_pidfd.c tools/localdpi/root_pidfd_cli.c tools/localdpi/root_hotspot_tun.c -o "$RUNNER_TEMP/root-pidfd"
          python3 tools/localdpi/tests/root_pidfd_cli_test.py "$RUNNER_TEMP/root-pidfd"
      - name: Compare Go and native TLS encoders
        working-directory: tools/xray
        run: CGO_ENABLED=1 go test -a -count=1 -tags localdpi_native ./localdpi/native ./zapret2
      - name: Exercise native-enabled TCP diagnostic integration
        working-directory: tools/xray
        run: CGO_ENABLED=1 go test -count=1 -tags localdpi_native -run '^(TestLocal|TestTaggedLocal)' ./bridge
      - name: Fuzz native TLS record parity and bounded recognition
        working-directory: tools/xray
        run: |
          CGO_ENABLED=1 go test -tags localdpi_native -run='^$' -fuzz='^FuzzNativeRecordParity$' -fuzztime=20s -parallel=2 ./localdpi/native
      - name: Race-check concurrent native wrapper calls
        working-directory: tools/xray
        run: CGO_ENABLED=1 go test -race -count=3 -tags localdpi_native ./localdpi/native
      - name: Fuzz shared read-only protocol recognition
        working-directory: tools/xray
        run: |
          go test -run='^$' -fuzz='^FuzzCommonHostRanges$' -fuzztime=20s -parallel=2 ./localdpi
      - name: Run protected TCP/QUIC AUTO, planner and Alpine tests
        working-directory: tools/xray
        run: go test -count=1 ./localdpi ./localdpi/native ./bridge ./zapret2 ./cmd/zapret2-alpine
      - name: Race-check socket evidence ownership and TCP duplex lifecycle
        working-directory: tools/xray
        run: CGO_ENABLED=1 go test -race -count=2 -run '^(TestSocketEvidenceGate|TestSocketLateReplyAfterTimeout|TestEstablishedTCPDuplex|TestInitialTCPReadiness|TestInitialTCPClose|TestTCPHalfClose)' ./bridge
      - name: Race-check Alpine connection admission and cleanup
        working-directory: tools/xray
        run: CGO_ENABLED=1 go test -race -count=3 ./cmd/zapret2-alpine
  portable-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/xray/go.mod
          cache-dependency-path: tools/xray/go.sum
      - name: Test shared library and unavailable native stub on Windows
        working-directory: tools/xray
        run: go test -count=1 ./localdpi ./localdpi/native
