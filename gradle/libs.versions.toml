# Версии всех зависимостей DPpass — в одном месте.
#
# Новая зависимость или смена версии — только вместе со строкой в
# docs/legal/THIRD_PARTY_MATRIX.md и docs/PROVENANCE.md (D-20); сверку
# делает tools/provenance/check_dependencies.py (шаг hostcheck).
# Обновление — по чек-листу D-18, а не «потому что вышло».

[versions]
kotlin = "2.4.20"
agp = "9.5.0"
kotlinx-coroutines = "1.11.0"
junit = "6.1.3"
# Форматтер Kotlin (D-63): только задачи ktlintCheck/ktlintFormat, в APK и cli не попадает.
ktlint = "1.8.0"
# Распознавание QR с картинки (D-65): только в app, только формат QR.
zxing = "3.5.4"
# Тесты экранов Android на JVM (D-86): только по свойству dppass.robolectric, в APK
# не попадает. «Android целиком» — образ SDK 36 (Android 16), который ждёт эта
# версия Robolectric (DefaultSdkProvider).
robolectric = "4.17"
# JUnit 4 — API тестов Robolectric (его запускатель — JUnit 4); та же версия, что тянет Robolectric.
junit4 = "4.13.2"
robolectric-android-all = "16-robolectric-13921718-i7"

# Ядро прокси (D-24): версия Xray и Go-модуль той же версии (тег v26.9.30
# upstream XTLS/Xray-core). Из него tools/xray собирает ядро для проверки
# компилятора на хосте; tools/xray/go.mod должен требовать именно его —
# сверяют check_dependencies.py и check_xray.py (версия собранного ядра).
xray = "26.9.30"
xray-go-module = "v1.260327.1-0.20260930074004-b26a91de4f32"

android-compileSdk = "36"
android-targetSdk = "36"
android-minSdk = "26"
# NDK для библиотеки ядра libdppassxray (D-25): cgo-компилятор и sysroot
# для GOOS=android; сборка — tools/xray/native.py android (задача :app
# xrayNative<Вариант>). Инструмент сборки: в APK из NDK ничего не попадает.
android-ndk = "30.0.16248370"

# Геоданные (D-27, D-31): источники набора, который tools/xray/geodata.py
# собирает своим кодом в assets APK (задача :app xrayGeodata<Вариант>).
# dlc — Go-модуль github.com/v2fly/domain-list-community (псевдоверсия с
# коммитом); DB-IP — месяц выпуска «IP to Country Lite», файл —
# tools/xray/geodata/sources/.
# Суммы — docs/PROVENANCE.md; сверяют check_dependencies.py и geodata.py.
geodata-dlc = "v0.0.0-20261004053103-63777333b7dd"
geodata-dbip = "2026-10"

# Оболочка Windows (D-97): архивы, которые tools/desktop/windows_deps.py
# скачивает при сборке и сверяет с SHA-256 из docs/PROVENANCE.md
# («Windows»); в репозиторий они не кладутся. Temurin — JDK для Windows
# x64: заголовки JNI моста и jmods рантайма jlink; Wintun — подписанные
# DLL (в комплект — amd64 без изменений). Сверяет и check_dependencies.py.
temurin-windows = "21.0.13+9"
wintun = "0.14.1"

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
# Запуск тестов JUnit 4 (Robolectric, D-86) на платформе JUnit — версия из junit-bom.
junit-vintage-engine = { module = "org.junit.vintage:junit-vintage-engine" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
junit4 = { module = "junit:junit", version.ref = "junit4" }
robolectric-android-all = { module = "org.robolectric:android-all-instrumented", version.ref = "robolectric-android-all" }

# ZXing core: распознавание QR (D-65), без зависимостей; в app и тесты app.
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }

# ktlint одним файлом (вариант с классификатором all, без транзитивных зависимостей, D-63).
ktlint-cli = { module = "com.pinterest.ktlint:ktlint-cli", version.ref = "ktlint" }

# Плагины для build-logic (подключаются как обычные зависимости).
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
android-gradle-plugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
android-application = { id = "com.android.application", version.ref = "agp" }
