# tools/dpverify.toml — профиль DP Verify для DPpass (D-50).
# Общие проверки — встроенные DP Verify (обязательный набор и необязательные ниже); предметные
# шаги DPpass — командами project.*. Соответствие прежним скриптам и внесённые ошибки — D-50 и
# описание PR пилота; вход — tools/hostcheck/run.sh (обёртка) или tools/dpv/dpv.
schema = 1
dpv = ">=1.0.0-rc1, <2"

[project]
name = "DPpass"
languages = ["kotlin", "python", "shell", "markdown"]
main_branch = "main"

[modules]
app = ["app/**"]
cli = ["cli/**"]

[process]
agent_rules = "CLAUDE.md"
todo = "TODO.md"
roadmap = "docs/direction/ROADMAP/README.md"
decisions = "docs/direction/DECISIONS.md"
decision_heading = '^### D-(\d{2})\b'
decision_ref = '\bD-(\d{2})\b'
decision_required_fields = ["**Проверка.**"]
provenance = "docs/PROVENANCE.md"
foreign_projects = ["VoxelRPG", "Galdhold", "DPlang", "DPmetaApp"]

[budget]
static = "10s"
affected = "5m"
full = "30m"

[affected]
on_unmapped = "full"
static_only = ["**/*.md"]
full_on = ["build-logic/**", "gradle/**", "*.gradle.kts", "**/build.gradle.kts", "gradle.properties"]

[[tool]]
name = "jdk"
probe = ["java", "-version"]
version_regex = 'version "(\d+)'
min = "21"

[[tool]]
name = "go"
probe = ["go", "version"]
version_regex = 'go(\d+\.\d+)'
min = "1.21"

[[tool]]
# тот же признак, что в settings.gradle.kts и run.sh: ANDROID_HOME, ANDROID_SDK_ROOT или sdk.dir
name = "android-sdk"
probe = ["bash", "tools/hostcheck/steps.sh", "android-sdk"]

[[tool]]
# NDK версии из каталога: им собирается libdppassxray.so для APK (D-25)
name = "android-ndk"
probe = ["bash", "tools/hostcheck/steps.sh", "android-ndk"]

# ---- обязательный набор ----

[checks."repo.layout"]
root_allow = [".editorconfig", ".gitignore", "CLAUDE.md", "LICENSE", "README.md", "TODO.md",
              "build.gradle.kts", "gradle.properties", "gradlew", "gradlew.bat", "settings.gradle.kts"]
required = ["docs/ARCHITECTURE.md", "docs/CONFIG_FORMAT.md", "docs/SECURITY_MODEL.md", "docs/TESTING.md"]
# выпуск DB-IP — источник набора геоданных в репозитории (D-31)
large_allow = ["tools/xray/geodata/sources/*.csv.gz"]
forbid = [
  { glob = "**/*.pem", reason = "ключи и сертификаты — вне репозитория (D-35)" },
  { glob = ".github/workflows/**", reason = "CI не используется и не запускается (D-23)" },
]

[checks."format.text"]
# корпус — байты как есть, предмет теста
skip = ["tests/data/**"]
trailing_space = true

[checks."docs.links"]
path_prefixes = ["docs/", "tools/"]
historical = ["docs/research/**"]
skip = ["tests/data/**"]

[[checks."docs.refs".kind]]
name = "threat"
ref = '\bT(\d{1,2})\b'
context = 'SECURITY_MODEL|угроз|\((?:[^()]*,\s*)?T\d{1,2}\)'
defined_in = ["docs/SECURITY_MODEL.md"]
definition = '^(?:#{2,4}\s+|\|\s*\*{0,2})T(\d{1,2})\b'

[[checks."docs.refs".kind]]
name = "stage"
ref = '[Ээ]тап\w*\s+(\d+)'
context = 'ROADMAP'
defined_in = ["docs/direction/ROADMAP/README.md"]
definition = '^#{1,6}\s+Этап\s+(\d+)'

[[checks."docs.refs".kind]]
name = "test-class"
ref = '`([A-Z]\w*Test)(?:\.\w+)?`'
defined_in = ["**/src/test/**/*.kt", "**/src/xrayJni/**/*.kt", "**/src/robolectric/**/*.kt"]
definition = '^class\s+(\w+Test)\b'

# ---- необязательные встроенные ----

[checks."code.forbidden"]
enabled = true
rule = [
  { id = "dns-resolve", regex = '\b(getByName|getAllByName|getLocalHost)\s*\(', files = ["**/*.kt", "**/*.kts"], allow = ["network/src/main/kotlin/com/dpsmpx/dppass/network/Latency.kt", "network/src/main/kotlin/com/dpsmpx/dppass/network/SocketProber.kt", "app/src/main/kotlin/com/dpsmpx/dppass/app/NetworkCheck.kt"], reason = "резолв имени мимо туннеля (T4); IP — core.IpAddress, байты — InetAddress.getByAddress; имя сервера — только TcpLatencyProbe, системой, как ядро (D-41, D-29); имена ориентиров — только пробы сети, резолвером сети под туннелем (D-60)" },
  { id = "secret-reveal", regex = '\.reveal\s*\(\s*\)', files = ["**/*.kt", "**/*.kts"], allow = ["**/src/test/**", "**/src/xrayJni/**", "diagnostics/src/main/kotlin/com/dpsmpx/dppass/diagnostics/Secret.kt", "config/src/main/kotlin/com/dpsmpx/dppass/config/ConfigValidator.kt", "config/src/main/kotlin/com/dpsmpx/dppass/config/ConfigWriter.kt", "engine/src/main/**", "engine/src/testFixtures/kotlin/com/dpsmpx/dppass/engine/mock/MockBackend.kt", "storage/src/main/**", "subscriptions/src/main/kotlin/com/dpsmpx/dppass/subscriptions/Codec.kt", "subscriptions/src/main/kotlin/com/dpsmpx/dppass/subscriptions/Https.kt", "subscriptions/src/main/kotlin/com/dpsmpx/dppass/subscriptions/Inline.kt", "connection/src/main/kotlin/com/dpsmpx/dppass/connection/Share.kt", "connection/src/main/kotlin/com/dpsmpx/dppass/connection/Relay.kt", "app/src/main/kotlin/com/dpsmpx/dppass/app/ui/ShareScreen.kt", "desktop/src/main/kotlin/com/dpsmpx/dppass/desktop/ui/SharePanel.kt"], reason = "значение секрета — только разбор и запись конфигурации, компиляторы ядер, хранилище, запись и загрузка подписки, свои серверы, логин и пароль раздачи — в хранилище и на её экране (на ПК — вкладка «Раздача»), вход устройства раздачи — в хранилище и в проверке SOCKS5 (D-11, D-36, D-42, D-51, D-55, D-84)" },
  { id = "stack-trace", regex = '\bprintStackTrace\s*\(', files = ["**/*.kt", "**/*.kts"], reason = "стек может нести секреты; причина — Diagnostic.fromThrowable (D-22)" },
  { id = "console", regex = '(?<![\w.])(println|print)\s*\(|\bSystem\.(out|err)\b', files = ["**/src/main/**/*.{kt,kts}"], allow = ["module:cli"], reason = "вывод в консоль — только cli/; остальное — Logger" },
  { id = "wall-clock", regex = '\bSystem\.(currentTimeMillis|nanoTime)\s*\(|\b(Instant|LocalDateTime|LocalDate|ZonedDateTime|OffsetDateTime)\.now\s*\(|\bDate\s*\(\s*\)', files = ["**/src/main/**/*.{kt,kts}"], allow = ["core/src/main/kotlin/com/dpsmpx/dppass/core/Support.kt", "cli/src/main/kotlin/com/dpsmpx/dppass/cli/Bench.kt"], reason = "время — только через core.Clock (D-21)" },
  { id = "weak-random", regex = '\bkotlin\.random\b|\bjava\.util\.Random\b|\bMath\.random\s*\(|(?<![\w.])Random\s*\(', files = ["**/src/main/**/*.{kt,kts}"], allow = ["build-logic/src/main/kotlin/com/dpsmpx/dppass/build/AppIdentity.kt"], reason = "ключи — SecureRandom; решения — детерминированно (D-15); зерно личности личной сборки — инструмент сборки (D-47)" },
  { id = "weak-crypto", regex = '"(MD5|SHA-?1|DES|DESede|RC4|ARCFOUR)"|"[A-Za-z0-9]+/ECB/|Cipher\.getInstance\s*\(\s*"AES"\s*\)', files = ["**/*.kt", "**/*.kts"], allow = ["network/src/main/kotlin/com/dpsmpx/dppass/network/Quic.kt"], reason = "слабый алгоритм или режим шифрования; исключение — маска заголовка QUIC: один блок AES от образца шифртекста (RFC 9001, §5.4.3, D-60)" },
  { id = "trust-override", regex = '\b(X509TrustManager|X509ExtendedTrustManager|HostnameVerifier|setHostnameVerifier|setDefaultHostnameVerifier|TrustAllCerts|ALLOW_ALL_HOSTNAME_VERIFIER)\b', files = ["**/*.kt", "**/*.kts"], reason = "своя проверка сертификата — её отключение (T5); запрещено и в тестах" },
  { id = "android-log", regex = '\bandroid\.util\.Log\b|(?<![\w.])Log\.(v|d|i|w|e|wtf)\s*\(', files = ["**/*.kt", "**/*.kts"], reason = "журнал — только Logger с редактированием (D-11)" },
  { id = "blocking", regex = '\bThread\.sleep\s*\(|\bGlobalScope\b|\brunBlocking\b', files = ["**/src/main/**/*.{kt,kts}"], allow = ["module:cli"], reason = "ожидание — через pause и Clock; корутины — в своём scope" },
  { id = "native-load", regex = '\bSystem\.load(Library)?\s*\(|\bRuntime\.getRuntime\(\)\.load|\bexternal\s+fun\b', files = ["**/*.kt", "**/*.kts"], allow = ["app/src/main/kotlin/com/dpsmpx/dppass/app/AppGraph.kt", "engine/src/main/kotlin/com/dpsmpx/dppass/engine/xray/XrayRuntime.kt", "tests/integration/src/xrayJni/**", "desktop/src/main/kotlin/com/dpsmpx/dppass/desktop/DesktopGraph.kt", "desktop/src/main/kotlin/com/dpsmpx/dppass/desktop/LinuxNative.kt"], reason = "нативный код — только мост ядра (D-25): JNI — XrayRuntime и функции Linux моста LinuxNative (D-74), загрузка — AppGraph, DesktopGraph и тест JNI" },
  { id = "android-import", regex = '^\s*import\s+android\.', files = ["**/src/main/**/*.kt"], allow = ["module:app"], reason = "Android только в app/: ядро собирается и проверяется на JVM (D-02, D-21)" },
  { id = "simulation-import", regex = '^\s*import\s+com\.dpsmpx\.dppass\.network\.simulation\.', files = ["**/src/main/**/*.kt"], allow = ["module:cli"], reason = "модель сети — тестовая фикстура network: тесты и cli, в основном коде модулей и в app её нет" },
  { id = "mock-engine-import", regex = '^\s*import\s+com\.dpsmpx\.dppass\.engine\.mock\.', files = ["**/src/main/**/*.kt"], allow = ["module:cli"], reason = "фиктивное ядро — тестовая фикстура engine: второй бэкенд тестов и cli, в APK его нет (D-25)" },
  { id = "inline-coordinates", regex = '"[\w.-]+:[\w.-]+:[\w.${}-]+"|\bid\s*\(\s*"[^"]+"\s*\)\s*version\b', files = ["**/*.gradle.kts"], reason = "зависимости и плагины — только через gradle/libs.versions.toml (D-18)" },
  { id = "repositories", regex = '\b(maven|ivy|jcenter|mavenLocal|flatDir)\s*[({]', files = ["**/*.gradle.kts"], reason = "репозитории — только google(), mavenCentral(), gradlePluginPortal() (D-18)" },
]

[checks."data.synthetic"]
enabled = true
rule = [
  { kind = "link-host", paths = ["**"], schemes = ["vless", "vmess", "trojan", "ss", "ssr", "hysteria2", "hy2", "tuic", "anytls", "wireguard", "wg", "socks", "socks5"] },
  { kind = "uuid", paths = ["**"], synthetic = '^00000000-0000-' },
  { kind = "ip", paths = ["tests/data/**"], keys = ["ip_cidr", "ip"] },
  { kind = "domain", paths = ["tests/data/**"], keys = ["server", "host", "server_name", "address", "domain", "domain_suffix", "sni", "serverName", "blocked_endpoints"], allow = [{ value = "example.ru", reason = "образец «отечественного» домена для правил DIRECT и DNS по суффиксу .ru" }] },
]

[checks."provenance.deps"]
enabled = true
registries = ["docs/legal/THIRD_PARTY_MATRIX.md", "docs/PROVENANCE.md"]
source = [
  { type = "gradle-catalog", catalog = "gradle/libs.versions.toml", wrapper = "gradle/wrapper/gradle-wrapper.properties" },
]

[checks."smoke.cli"]
enabled = true
binary = "cli/build/install/dppass-cli/bin/dppass-cli"
# CLI собирает project.build (:cli:installDist); прежний cli_smoke из run.sh
after = ["project.build"]
case = [
  { args = ["check", "tests/data/configs/valid-multi.json"], code = 0, contains = ["ACTIVATED"] },
  { args = ["check", "tests/data/configs/limited-backend-xhttp.json", "--backend", "mock-limited"], code = 1, contains = ["CAPABILITY_TRANSPORT_UNSUPPORTED"] },
  { args = ["check", "tests/data/configs/invalid-allow-insecure.json"], code = 1, contains = ["INSECURE_TLS_REJECTED"] },
  { args = ["route", "tests/data/configs/valid-multi.json", "--domain", "www.example.ru"], code = 0, contains = ["DIRECT (ru-direct)"], not_contains = ["примечание"] },
  { args = ["route", "tests/data/configs/valid-multi.json", "--ip", "198.51.100.7"], code = 0, contains = ["geoip/geosite не проверены"] },
  { args = ["classify", "--condition", "ALLOWLIST_LIKE"], code = 0, contains = ["restriction=ALLOWLIST_LIKE"] },
  { args = ["plan", "tests/data/configs/valid-multi.json", "--condition", "TLS_DEGRADED"], code = 0, contains = ["1. xhttp-cdn [HTTP_CDN]"] },
  { args = ["connect", "tests/data/configs/valid-multi.json", "--condition", "ALLOWLIST_LIKE"], code = 0, contains = ["CONNECTED via domestic-relay"] },
  { args = ["connect", "tests/data/configs/valid-multi.json", "--condition", "OFFLINE"], code = 1, contains = ["NETWORK_OFFLINE"] },
  { args = ["subscription", "tests/data/subscriptions/links-with-directives.txt", "--headers", "tests/data/subscriptions/links-with-directives.headers.json"], code = 0, contains = ["READY revision=1 profiles=3"], not_contains = ["evil.example.com"] },
  { args = ["subscription", "tests/data/subscriptions/links-invalid-names.txt"], code = 0, contains = ["SERVER_NAME_INVALID at entry[1].security.server_name"], not_contains = ["test-password"] },
  { args = ["export", "tests/data/configs/valid-minimal.json"], code = 0, contains = ['"id": "<redacted>"'], not_contains = ["00000000-0000-4000-8000-000000000001"] },
  { args = ["report", "tests/data/configs/valid-minimal.json"], code = 0, contains = ["active_profile: reality-1"], not_contains = ["00000000-0000-4000-8000-000000000001"] },
  { args = ["bench", "--rules", "200"], code = 0, contains = ["route decisions:"] },
  { args = ["no-such-command"], code = 2 },
]

# ---- предметные шаги DPpass без сборки (остаток прежних скриптов — в их описании) ----

[[command]]
id = "project.modules"
run = ["python3", "tools/hostcheck/check_modules.py"]
level = "static"

[[command]]
id = "project.fixtures"
run = ["python3", "tools/hostcheck/check_fixtures.py"]
level = "static"

[[command]]
id = "project.docs"
run = ["python3", "tools/hostcheck/check_docs.py"]
level = "static"

[[command]]
id = "project.deps"
run = ["python3", "tools/provenance/check_dependencies.py"]
level = "static"

[[command]]
id = "project.manifest"
run = ["python3", "tools/hostcheck/check_manifest.py"]
level = "static"

[[command]]
id = "project.contrast"
run = ["python3", "tools/hostcheck/check_contrast.py"]
level = "static"

[[command]]
id = "project.format"
run = ["python3", "tools/hostcheck/check_format.py"]
level = "static"

[[command]]
id = "project.telemetry"
run = ["python3", "tools/hostcheck/check_build_telemetry.py"]
level = "static"

[[command]]
id = "project.device-tests"
run = ["python3", "tools/hostcheck/check_device_tests.py"]
level = "static"

[[command]]
id = "project.readme"
run = ["python3", "tools/hostcheck/readme_progress.py", "--check"]
level = "static"

# ---- сборка, тесты, Xray, Android ----

[[command]]
id = "project.build"
run = ["bash", "tools/hostcheck/steps.sh", "build"]
paths = ["**/*.kt", "**/*.kts", "gradle/**", "tests/**", "cli/**"]
requires = ["jdk"]
timeout = "30m"
# итог Gradle — строка BUILD SUCCESSFUL, а не последняя строка вывода
summary = '^BUILD SUCCESSFUL.*'

[[command]]
id = "project.xray"
run = ["python3", "tools/xray/check_xray.py"]
paths = ["tools/xray/**", "engine/**", "tests/data/**", "gradle/libs.versions.toml"]
requires = ["go"]

[[command]]
id = "project.xray-bridge"
run = ["bash", "tools/hostcheck/steps.sh", "xray-bridge"]
paths = ["tools/xray/**", "engine/**", "tests/integration/**"]
requires = ["jdk", "go"]

[[command]]
id = "project.geodata"
run = ["python3", "tools/xray/geodata.py", "--test"]
paths = ["tools/xray/**", "gradle/libs.versions.toml"]
requires = ["go"]

[[command]]
id = "project.android"
# тестовый APK тестов на телефоне (D-75) — собирается всегда, даже пока его не запускают
run = ["./gradlew", "--console=plain", "--warning-mode=summary", ":app:build", ":app:lint", ":app:assembleDebugAndroidTest"]
paths = ["module:app", "**/src/main/**/*.kt", "tools/xray/**"]
requires = ["jdk", "go", "android-sdk", "android-ndk"]
timeout = "40m"
# итог Gradle — строка BUILD SUCCESSFUL, а не последняя строка вывода
summary = '^BUILD SUCCESSFUL.*'

[[command]]
id = "project.android-screens"
# экраны телефона на JVM (D-86): тесты D-75 под Robolectric, вместе с остальными тестами app.
# Robolectric и AndroidX тестов — только по этому свойству: сборка без него (в том числе в Termux) их не тянет
run = ["./gradlew", "--console=plain", "--warning-mode=summary", "-Pdppass.robolectric", ":app:testDebugUnitTest"]
paths = ["module:app"]
requires = ["jdk", "android-sdk"]
after = ["project.android"]
timeout = "20m"
summary = '^BUILD SUCCESSFUL.*'

[[command]]
id = "project.android-api"
run = ["python3", "tools/hostcheck/check_android_api.py"]
paths = ["**/src/main/**/*.kt"]
requires = ["android-sdk"]
after = ["project.build"]

[[command]]
id = "project.apk"
run = ["python3", "tools/hostcheck/check_apk.py"]
paths = ["module:app", "tools/xray/**"]
requires = ["android-sdk"]
after = ["project.android"]
